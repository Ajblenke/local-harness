version = 1

; Stable one-model-at-a-time baseline for an 8 GiB GPU. The previous 160K Qwen
; setting measured 7.4 GiB and left too little headroom for desktop variation.
[*]
np = 1
n-gpu-layers = 999
jinja = true
cache-type-k = q8_0
cache-type-v = q8_0

[qwen3.5-4b]
model = $HOME/models/qwen3.5-4B/Qwen3.5-4B-UD-Q4_K_XL.gguf
c = 131072
temp = 0.6
top-p = 0.95
top-k = 20
reasoning-budget = 1024

; Comparison model. With LLM_MODELS_MAX=1 the router unloads Qwen before this
; model is used, so the two KV caches never compete for VRAM.
[minicpm5-2b]
model = $HOME/models/minicpm5-2B/MiniCPM5-2B-Q8_0.gguf
c = 32768
temp = 1.0
top-p = 0.95
min-p = 0.0
reasoning-budget = 1024
